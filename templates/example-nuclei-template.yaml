id: exposed-git-config
info:
  name: "Exposed .git/config"
  severity: medium

requests:
  - method: GET
    path: "/.git/config"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["[core]", "repositoryformatversion"]

  - method: GET
    path: "/"
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words: ["Apache"]
      - type: regex
        part: header
        regex: ["nginx/[0-9]"]
